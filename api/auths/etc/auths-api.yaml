Name: auths-api
Host: 0.0.0.0
Port: 8888
Mode: dev

Middlewares:
  Log: false #  request log
  Recover: true
# register center
Consul:
  Host: 124.71.72.124:8500
  Key: auths.rpc
#  trace
Telemetry:
  Name: auths.api
  Endpoint: http://124.71.72.124:14268/api/traces
  Batcher: jaeger
  Sampler: 1.0

# log
Log:
  ServiceName: "auths-api"
  Mode: 'console'
  Encoding: "json"
  Level: "info" # info==warn ,server==error
  Path: "./logs/auths-api"
# rpc
AuthsRpc: # 需要与config保持一致
  Target: consul://124.71.72.124:8500/auths.rpc?wait=14s
  NonBlock: true # 启动时是否阻塞 , 即使rpc服务没有启动也不会影响客户端的启动
  Timeout: 1000